<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;

    }
    .bx{
        height: 400px;
        width: 200px;
        border: 2px solid black;
        display: block;
        margin-left: auto;
        margin-right: auto;
        box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.5), 0 6px 20px 0 rgba(0, 0, 0, 0.5);
        
    }
    .bx bx1{
        height: 50px;
        width: 50px;
    }
.bx2{
            height: 25px;
            width: 25px;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}
    .bx3{
        height: 25px;
        text-align: center;
        background-color: chartreuse;

        
    }


    
</style>
<body>

    <div class="bx">
        <div class="bx1">
    <img src="images/food.jpg" alt="food" height="200px" width="200px">
    <h3>INDIAN FOOD</h3>
    </div>
    <div class="bx2">
        <img class="bx2" src="images/star1.jpg" alt="" height="25px" width="25px">

    </div>
    <div class="bx3">
       <p>DELICIOUS</p>
    </div>
    
    
</div>
    
</body>
</html>
