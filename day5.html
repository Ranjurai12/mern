<!--Typography-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
        p{
            text-decoration: underline 2px red;
            text-align: center;
            font-family: "Roboto", sans-serif;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Magnam a dicta sequi quibusdam necessitatibus saepe officia, eos sit nulla magni, numquam non recusandae corporis provident perferendis atque illo deserunt quia.</p>
</body>
</html>
