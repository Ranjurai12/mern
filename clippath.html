<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css</title>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        padding: 10px;
      }

      .bx1 {
        height: 25px;
        width: 25px;
        background-color: red;
        clip-path: circle();
      }
    </style>



  </head>

  <body>

    <div class="bx1">
<img class="bx1" src="images/star1.jpg" alt="star">


    </div>







  </body>

</html>
