<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;

        }

        .bx{
            height: 100px;
            width: 100px;
            background-color: red;
            border: 1px,solid black;
            border-radius: 20px 5px 4px 20px;
            padding: 10px;
        }
        .bx1{
            height: 100px;
            width: 100px;
            background-color:purple;
            border: 1px,solid black;
            padding: 10px;
            /*margin-left: 100px;*/
            border-radius: 20px 5px 4px 20px;
            position: absolute;
            top: 100px;
            left: 100px;
            
        }
        .bx2{
             height: 100px;
            width: 100px;
            background-color: red;
            border: 1px,solid black;
            padding: 10px;
            /*margin-left: 200px;*/
            border-radius: 20px 5px 4px 20px;
            position: absolute;
            top: 200px;
            left: 200px;

        }
    </style>
</head>
<body>
    <div class="bx">
        <p>hello</p>
    </div>
    <div class="bx1">
        <p>hi</p>
    </div>
    <div class="bx2">
        <p>hello hello</p>
    </div>
</body>
</html>
